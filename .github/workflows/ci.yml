name: BioAlign-Pro Scientific Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Core Scientific Logic & Build Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js (v20)
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Dynamic Programming Consistency Checks (Paths/Coordinates)
      run: npm run test:dp

    - name: Exact Mathematical Equivalence Checks (Needle/Water benchmarks)
      run: npm run test:score

    - name: Contract & API Standard Conformance Checks
      run: npm run test:standards

    - name: Bundling & Packaging Engine
      run: npm run build
